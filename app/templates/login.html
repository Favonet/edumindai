{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao login">
  <h1>Entrar no EduMindAI</h1>
  <p class="sutil">Use o e-mail e a senha fornecidos pela escola.</p>
  {% if erro %}<p class="erro" role="alert" id="erro-login">{{ erro }}</p>{% endif %}
  <form method="post" action="/login" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}" {% if erro %}aria-describedby="erro-login" aria-invalid="true"{% endif %}>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="botao" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
